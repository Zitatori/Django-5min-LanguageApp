{% load i18n %}
<div class="rt-field">
  <label for="private-note">🔒 {% get_current_language as lang %}{% if lang == 'ja' %}自分用のメモ（任意・講師には共有されません）{% else %}Private notes (optional — not shared with your tutor){% endif %}</label>
  <textarea id="private-note" name="private_note" maxlength="1000" rows="4">{{ match.student_private_note }}</textarea>
  <p class="rt-note-help">{% trans "Administrators can view your private notes. They are not shared with tutors." %}</p>
</div>
