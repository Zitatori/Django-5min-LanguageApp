{% load i18n %}
<form method="post" action="{% url 'set_display_currency' %}" class="dcur">
{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
<label for="display-currency">{% trans 'Display currency' %}</label>
<select name="currency" id="display-currency">
{% for code, label in display_currency_choices %}<option value="{{ code }}" {% if code == display_currency %}selected{% endif %}>{{ code }} — {{ label }}</option>{% endfor %}
</select><button type="submit" class="btn btn-sm btn-secondary">{% trans 'Apply' %}</button>
</form>
{% if converted_price %}<p class="dcur-note">{% blocktrans with rate=display_rate_label %}Estimated conversion at a fixed rate: CHF 1 = {{ rate }}. The final payment amount and currency are confirmed by email.{% endblocktrans %}</p>{% endif %}
<style>
  .dcur { display: flex; flex-direction: row; align-items: center; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .dcur label { font-size: 14px; font-weight: 900; }
  .dcur select { flex: 1 1 180px; min-width: 0; max-width: 100%; font-size: 16px; }
  .dcur-note { margin: 0; color: var(--ink-soft); font-size: 13px; font-weight: 700; }
</style>
